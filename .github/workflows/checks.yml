# Shared checks of the organization on each pull request and on main.
name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  checks:
    uses: aromapacifico-devops/.github/.github/workflows/terraform-root.yml@main
    with:
      roots: envs/dev envs/test envs/prod bootstrap
    permissions:
      contents: read
