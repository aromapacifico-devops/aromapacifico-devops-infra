# Plans every environment on each pull request and comments a readable summary.
name: plan

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NAME_PREFIX: fnc-aroma
  TF_IN_AUTOMATION: "1"

jobs:
  gate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the harvest freeze gate
        run: python3 -m unittest discover -s tests -v

  plan:
    name: plan ${{ matrix.environment }}
    # Pull requests from forks get no cloud credentials.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, prod]
    environment: plan-${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      CENTER_LINK_IPS: ${{ vars.CENTER_LINK_IPS }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        run: .github/scripts/install-tool.sh terraform

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/fnc-aroma-${{ matrix.environment }}-role-pipeline-plan
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Plan
        id: plan
        run: .github/scripts/plan.sh pr

      - name: Comment the summary
        if: always() && hashFiles('summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/comment.sh summary.md

      - name: Install Infracost
        if: steps.plan.outputs.planned == 'true'
        run: .github/scripts/install-tool.sh infracost

      - name: Cost of the plan
        if: steps.plan.outputs.planned == 'true'
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/cost.sh
